name: Fraud Detection Engine — CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  # ─── Job 1: Lint & Type Check ───────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: TypeScript Type Check (strict)
        working-directory: ./backend
        run: npx tsc --noEmit

  # ─── Job 2: Unit Tests ──────────────────────────────────────────────────────
  unit-tests:
    name: Run Algorithm Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Tests
        working-directory: ./backend
        run: npm run test

  # ─── Job 3: Build Backend Docker Image ─────────────────────────────────────
  build-backend:
    name: Build & Verify Backend Docker Image
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t fraud-engine-backend:${{ github.sha }} ./backend
          echo "✅ Backend Docker build succeeded"

  # ─── Job 4: Build Frontend Docker Image ─────────────────────────────────────
  build-frontend:
    name: Build & Verify Frontend Docker Image
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: |
          docker build -t fraud-engine-frontend:${{ github.sha }} ./frontend
          echo "✅ Frontend Docker build succeeded"

  # ─── Job 5: Security Audit ───────────────────────────────────────────────────
  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Run npm audit
        working-directory: ./backend
        run: npm audit --audit-level=high || true
